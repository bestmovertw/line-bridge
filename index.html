<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在開啟預約系統...</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #ffffff; }
        .container { text-align: center; padding: 0 20px; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #00b900; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        p { color: #555; font-size: 16px; font-weight: bold; }
        .btn-group { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
        .line-btn { display: none; padding: 14px 24px; font-size: 18px; font-weight: bold; color: #ffffff; background-color: #00b900; text-decoration: none; border-radius: 50px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .call-btn { padding: 12px 20px; font-size: 16px; font-weight: bold; color: #333; background-color: #f0f0f0; text-decoration: none; border-radius: 50px; }
    </style>
</head>
<body>
    <div class="container">
        <div id="loader" class="loader"></div>
        <p id="status-text">正在為您開啟 LINE，請稍候...</p>

        <div class="btn-group">
            <a id="manual-line-btn" href="#" class="line-btn">👉 點此開啟 LINE 加入好友</a>
            <a href="tel:+886903573073" class="call-btn">☎️ 若無法加入，請點此打給阿正</a>
        </div>
    </div>

    <script>
        const CONFIG = {
            LIFF_ID: "2010088960-cJY7OeEm",
            N8N_URL: "https://n8n.parzival0626.com/webhook/88164885-9c6f-4956-9b61-593146ec099f",
            MOBILE_OA_ID: "@851scjne",
            PC_OA_ID: "@851scjne",
            FALLBACK_URL: "https://lin.ee/yjCjRCL"
        };

        // ---------- 工具函式 ----------

        function send(data) {
            try {
                const formData = new URLSearchParams();
                for (const key in data) { formData.append(key, data[key]); }
                if (window.fetch) {
                    fetch(CONFIG.N8N_URL, {
                        method: 'POST', body: formData, mode: 'no-cors', keepalive: true
                    }).catch(() => {
                        if (navigator.sendBeacon) navigator.sendBeacon(CONFIG.N8N_URL, formData);
                    });
                } else if (navigator.sendBeacon) {
                    navigator.sendBeacon(CONFIG.N8N_URL, formData);
                }
            } catch (err) { console.error("Webhook 送出失敗", err); }
        }

        function showManualButton(targetUrl, statusMsg) {
            document.getElementById('loader').style.display = 'none';
            if (statusMsg) document.getElementById('status-text').innerText = statusMsg;
            const btn = document.getElementById('manual-line-btn');
            btn.href = targetUrl || CONFIG.FALLBACK_URL;
            btn.style.display = 'inline-block';
        }

        function getParam(params, key, storageKey) {
            const v = params.get(key) || sessionStorage.getItem(storageKey) || "";
            if (v) sessionStorage.setItem(storageKey, v);
            return v;
        }

        // ---------- 主流程 ----------

        async function main() {
            try {
                const params = new URLSearchParams(window.location.search);
                const ua = navigator.userAgent.toLowerCase();
                const isLineUA = ua.indexOf('line') > -1;
                const isMobile = /iphone|ipad|ipod|android/.test(ua);

                // ★ 關鍵旗標：只要這次載入是「已經被導去 liff.line.me 之後回到的頁面」，
                //   就標記 in_liff=1，之後絕不再往 liff.line.me 跳，從根斷開互跳迴圈。
                const inLiffFlag = params.get('in_liff') === '1';

                const gclid  = getParam(params, 'gclid',  'saved_gclid');
                const gbraid = getParam(params, 'gbraid', 'saved_gbraid');
                const wbraid = getParam(params, 'wbraid', 'saved_wbraid');

                fetch('https://api.ipify.org?format=json')
                    .then(r => r.json())
                    .then(d => { if (d.ip) sessionStorage.setItem('saved_ip', d.ip); })
                    .catch(() => {});

                const addFriendUrl = `https://line.me/R/ti/p/${CONFIG.MOBILE_OA_ID}`;

                // ============================================================
                // 判定是否進入「第二段（取 profile）」：
                // 不再只靠 UA 含 line，而是「UA 含 line」或「已帶 in_liff 旗標」皆可。
                // 後者涵蓋 Chrome 無痕：它在自己分頁開 liff.line.me，UA 不含 line，
                // 但只要 liff.init 能成功，就應該嘗試取 profile，而非又往外跳。
                // ============================================================
                if (isLineUA || inLiffFlag) {
                    let payload = {
                        gclid, gbraid, wbraid,
                        user_ip:    sessionStorage.getItem('saved_ip') || "unknown",
                        source:     "Inside_Line",
                        timestamp:  new Date().toISOString(),
                        lineUserId: "",
                        lineName:   ""
                    };

                    const loginTry = parseInt(params.get('login_try') || "0", 10);
                    const MAX_LOGIN_TRY = 1;

                    try {
                        await Promise.race([
                            (async () => {
                                await liff.init({ liffId: CONFIG.LIFF_ID });

                                if (!liff.isLoggedIn()) {
                                    if (loginTry >= MAX_LOGIN_TRY) {
                                        throw new Error('login_blocked');
                                    }
                                    const back = new URL(window.location.href);
                                    back.searchParams.set('in_liff', '1');
                                    back.searchParams.set('login_try', String(loginTry + 1));
                                    liff.login({ redirectUri: back.toString() });
                                    await new Promise(() => {});
                                }

                                const profile = await liff.getProfile();
                                payload.lineUserId = profile.userId;
                                payload.lineName   = profile.displayName;
                                payload.source     = "Mobile_Success_UID";
                                payload.user_ip    = sessionStorage.getItem('saved_ip') || "unknown";
                            })(),
                            new Promise((_, reject) => setTimeout(() => reject(new Error('liff_timeout')), 8000))
                        ]);
                    } catch (e) {
                        if (e.message === 'login_blocked')      payload.source = "Mobile_LIFF_LoginBlocked_Bypass";
                        else if (e.message === 'liff_timeout')  payload.source = "Mobile_LIFF_Timeout_Bypass";
                        else                                    payload.source = "Mobile_LIFF_Error_Bypass";
                    }

                    send(payload);
                    // ★ 無論成功與否，第二段結束都直接去加好友，絕不再往 liff.line.me 跳
                    showManualButton(addFriendUrl, "即將帶您加入好友，若未自動開啟請點下方按鈕：");
                    window.location.assign(addFriendUrl);
                    return;
                }

                // ============================================================
                // 第一段：純外部瀏覽器（尚未進過 liff）→ 導去 liff.line.me 並帶 in_liff=1
                // ============================================================

                const qs =
                    `in_liff=1` +
                    `&gclid=${encodeURIComponent(gclid)}` +
                    `&gbraid=${encodeURIComponent(gbraid)}` +
                    `&wbraid=${encodeURIComponent(wbraid)}`;

                const targetUrl = isMobile
                    ? `https://liff.line.me/${CONFIG.LIFF_ID}?${qs}`
                    : `https://line.me/R/ti/p/${CONFIG.PC_OA_ID}?gclid=${encodeURIComponent(gclid)}&gbraid=${encodeURIComponent(gbraid)}&wbraid=${encodeURIComponent(wbraid)}`;

                showManualButton(targetUrl, "若未自動開啟，請點擊下方按鈕加入 LINE：");
                window.location.assign(targetUrl);

            } catch (fatalError) {
                console.error("發生嚴重錯誤，強制啟動備用跳轉", fatalError);
                showManualButton(CONFIG.FALLBACK_URL, "開啟發生問題，請點下方按鈕：");
                window.location.href = CONFIG.FALLBACK_URL;
            }
        }

        main();
    </script>
</body>
</html>
